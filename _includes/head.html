<!-- Computer Modern (CMU) Fonts -->
<style>
  @font-face {
    font-family: 'CMU Serif';
    src: url('https://cdn.jsdelivr.net/npm/cmu-serif@0.1.0/cmunrm.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/npm/cmu-serif@0.1.0/cmunrm.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  @font-face {
    font-family: 'CMU Serif';
    src: url('https://cdn.jsdelivr.net/npm/cmu-serif@0.1.0/cmunti.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/npm/cmu-serif@0.1.0/cmunti.ttf') format('truetype');
    font-weight: normal;
    font-style: italic;
  }
  @font-face {
    font-family: 'CMU Serif';
    src: url('https://cdn.jsdelivr.net/npm/cmu-serif@0.1.0/cmunbx.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/npm/cmu-serif@0.1.0/cmunbx.ttf') format('truetype');
    font-weight: bold;
    font-style: normal;
  }
  @font-face {
    font-family: 'CMU Serif';
    src: url('https://cdn.jsdelivr.net/npm/cmu-serif@0.1.0/cmunbi.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/npm/cmu-serif@0.1.0/cmunbi.ttf') format('truetype');
    font-weight: bold;
    font-style: italic;
  }
  @font-face {
    font-family: 'CMU Typewriter';
    src: url('https://cdn.jsdelivr.net/npm/cmu-typewriter@0.1.0/cmuntt.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/npm/cmu-typewriter@0.1.0/cmuntt.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
</style>

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>
