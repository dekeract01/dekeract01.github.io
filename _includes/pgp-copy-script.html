<script>
function copyPGPKey() {
  const keyElement = document.getElementById('pgp-key');
  if (!keyElement) {
    console.error('PGP key element not found');
    return;
  }
  
  // Get the text content more specifically
  let key = keyElement.innerText || keyElement.textContent;
  
  // Debug logging
  console.log('Key element found:', keyElement);
  console.log('Key content length:', key ? key.length : 0);
  console.log('Key content preview:', key ? key.substring(0, 50) + '...' : 'empty');
  
  if (!key || key.trim().length < 10) {
    console.error('PGP key content appears to be empty or too short');
    alert('Error: Could not find PGP key content to copy');
    return;
  }
  
  // Clean up the key text
  key = key.trim();
  
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(key).then(() => {
      showCopySuccess();
      console.log('Successfully copied to clipboard');
    }).catch((err) => {
      console.error('Modern clipboard API failed:', err);
      fallbackCopy(key);
    });
  } else {
    fallbackCopy(key);
  }
}

function fallbackCopy(text) {
  const textArea = document.createElement('textarea');
  textArea.value = text;
  textArea.style.position = 'fixed';
  textArea.style.left = '-999999px';
  textArea.style.top = '-999999px';
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  
  try {
    const success = document.execCommand('copy');
    if (success) {
      showCopySuccess();
      console.log('Fallback copy successful');
    } else {
      console.error('execCommand returned false');
      alert('Failed to copy to clipboard. Please copy manually.');
    }
  } catch (err) {
    console.error('Fallback copy failed:', err);
    alert('Failed to copy to clipboard. Please copy manually.');
  }
  
  document.body.removeChild(textArea);
}

function showCopySuccess() {
  const btn = document.getElementById('copy-btn');
  if (btn) {
    const originalHTML = btn.innerHTML;
    btn.innerHTML = '<span style="color: #228B22; font-size: 14px;">✓</span>';
    setTimeout(() => {
      btn.innerHTML = originalHTML;
    }, 2000);
  }
}
</script>
